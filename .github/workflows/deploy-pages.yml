name: Deploy GitHub Pages

# Gatilho por push está DESLIGADO de propósito (2026-08-06).
#
# A fila de deployment do Pages deste repositório parou de consumir deploys
# vindos do Actions: todo run fica em "deployment_queued" até o teto de
# 600000 ms do actions/deploy-pages e é abortado. Não adianta mexer no
# "timeout" (o action tem teto rígido) nem repetir o mesmo commit (o ID do
# deployment é o próprio SHA, então o Pages cancela o repetido na hora).
#
# Enquanto isso, o site é publicado pelo builder clássico do Pages:
# Settings -> Pages -> Source = "Deploy from a branch", branch main, pasta
# "/ (root)". O index.html está na raiz e o .nojekyll evita o Jekyll.
#
# Se a fila do Actions voltar a funcionar, rode este workflow pelo
# "Run workflow" e, dando verde, devolva o gatilho de push abaixo.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
