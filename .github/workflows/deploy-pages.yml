name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # O padrão do action é esperar 10 min o Pages publicar e então
          # abortar. Em 06/08/2026 um deploy ficou 10 min inteiros em
          # "deployment_queued" e falhou por isso — o artefato estava certo,
          # só o serviço de Pages estava lento. 30 min evita perder um deploy
          # bom por causa de fila do GitHub.
          timeout: 1800000
