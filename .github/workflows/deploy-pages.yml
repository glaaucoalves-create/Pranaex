name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Não adianta aumentar o "timeout" daqui: o action tem teto rígido de
      # 600000 ms e devolve "timeout value is greater than the allowed
      # maximum" se passar disso. Se um deploy falhar preso em
      # "deployment_queued", é fila do Pages — reenviar num commit NOVO
      # resolve; repetir no mesmo commit não, porque o ID do deployment é o
      # próprio SHA e o Pages cancela o repetido na hora.
      - id: deployment
        uses: actions/deploy-pages@v4
