name: Deploy GitHub Pages

# Se um deploy travar, o culpado provável é um run ANTIGO parado em
# "waiting" no ambiente github-pages: ele segura o ambiente e todo run novo
# fica em "pending" sem nunca começar. O conserto é cancelar o run velho
# (Actions -> o run -> Cancel), e aí o da fila anda sozinho.
#
# Já testado e descartado como conserto:
#  - aumentar "timeout" no deploy-pages: teto rígido de 600000 ms, ignora
#    valor maior e ainda avisa no log;
#  - reenviar o MESMO commit: o ID do deployment é o próprio SHA, o Pages
#    cancela o repetido em segundos ("Deployment cancelled").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
